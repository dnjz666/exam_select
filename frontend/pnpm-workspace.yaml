# pnpm 11 的工程级设置（不再读 package.json 的 "pnpm" 字段）。

# ---------------------------------------------------------------------------
# 供应链：拒绝安装"太新"的版本
# ---------------------------------------------------------------------------
# 1440 分钟 = 24 小时：一个包发布满一天之后才允许进入本工程。
# 这条防护针对的是真实攻击手法——投毒版本（账号被盗 / 依赖混淆）通常在发布后
# 数小时内被下架，等一天就能躲开绝大多数窗口期。
#
# ⚠️ **必须显式写死，不能依赖默认值**：不同 pnpm 安装（本机独立 pnpm 与
# IDE/工具链自带的 pnpm）对默认值的解析并不一致。上一轮就是因为生成 lockfile
# 的那个 pnpm 把它当成 0，挑了一批几小时前刚发布的版本写进 `pnpm-lock.yaml`，
# 结果在策略生效的环境里 `pnpm dev` 直接失败（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
# 写死之后，解析与校验用同一把尺子，任何机器上结果一致。
#
# 被这条策略挡住时的**正确做法**（按优先级）：
#   1. 等够 24 小时后重跑 `pnpm install` —— 大多数情况只需要等；
#   2. 确实要立刻用某个新版本，把它加进下面的 `minimumReleaseAgeExclude`
#      （等于显式承担该包的风险，务必在 PR 说明理由）；
#   3. **不要**把本值改成 0 来"解决"报错 —— 那等于关掉整条防护。
minimumReleaseAge: 1440

# 例外名单（留空 = 无例外）。格式为包名或 `包名@版本`：
# minimumReleaseAgeExclude:
#   - some-pkg

# ---------------------------------------------------------------------------
# 构建脚本白名单
# ---------------------------------------------------------------------------
# esbuild 设为 false（**显式不允许**执行其 postinstall）：
#   Vite 需要的是 esbuild 的原生二进制，而该二进制由可选依赖
#   `@esbuild/win32-x64` 直接提供，postinstall 只是"二进制缺失时的兜底下载 +
#   校验"，在依赖完整时并非必需。显式关闭可避免在受限环境（无法 spawn 子进程的
#   沙箱）里让 `pnpm install` 因 EPERM 失败，同时符合供应链最小权限。
# 如遇 esbuild 报 "Cannot find the binary"，把它改回 true 再 `pnpm install` 即可。
allowBuilds:
  esbuild: false
